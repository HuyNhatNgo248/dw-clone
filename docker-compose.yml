services:
  payload:
    image: node:22.23.5-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # Overrides .env: inside compose the DB is the `postgres` service, not 127.0.0.1
      DATABASE_URI: postgres://postgres:postgres@postgres:5432/dw

  postgres:
    restart: always
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dw
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  node_modules:
